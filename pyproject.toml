[project]
name = "tdg"
version = "0.1.0"
description = "Websites from Typst: blogs and software docs, with interactive 3D widgets built in."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Felix Granum" }]
dependencies = ["jinja2>=3.1", "griffe>=1.5"]

[project.scripts]
tdg = "tdg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdg"]

[tool.hatch.build.targets.wheel.force-include]
"typst" = "tdg/_typst"  # the Typst library, bundled
