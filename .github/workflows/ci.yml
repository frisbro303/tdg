# Test the Typst package (PDF, HTML and a bundled site), test the plugin, and build tdg's docs with tdg; on main,
# publish them to GitHub Pages. (Pages deploy from GitHub Actions: Settings > Pages > Source.)
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.0
      - run: cd plugin && cargo test
      - run: ./typst/tests/run.sh
      - name: Install this tdg as @local/tdg
        run: |
          mkdir -p ~/.local/share/typst/packages/local/tdg
          cp -R typst ~/.local/share/typst/packages/local/tdg/0.2.0
      - run: typst compile --root . --features html,bundle --format bundle docs/site.typ docs/_site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
